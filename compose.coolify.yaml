# Coolify: Docker Compose build pack, normal mode (not Raw Compose).
# Base Directory: /    Compose location: /compose.coolify.yaml
# Domain target: service `app`, port 3131. Coolify adds the Traefik labels.
#
# Required variables: DATABASE_URL, SETUP_TOKEN, MAIL_SESSION_SECRET.
# PostgreSQL is bundled and initialized from DATABASE_URL. No host web/mail
# ports are published, so an existing Stalwart deployment remains untouched.

services:
  postgres-init:
    image: node:24-alpine
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Coolify}
      DB_INIT_DIR: /db-init
    volumes:
      - ./scripts/postgres-url-init.mjs:/app/postgres-url-init.mjs:ro
      - postgres-init:/db-init
    command: ["node", "/app/postgres-url-init.mjs"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER_FILE: /db-init/user
      POSTGRES_PASSWORD_FILE: /db-init/password
      POSTGRES_DB_FILE: /db-init/database
    volumes:
      - postgres-init:/db-init:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /db-init/user)\" -d \"$$(cat /db-init/database)\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3131
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Coolify}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN in Coolify}
      MAIL_SESSION_SECRET: ${MAIL_SESSION_SECRET:?set MAIL_SESSION_SECRET in Coolify}
      MAIL_DATA_DIR: /app/data/mail
      MAIL_SMTP_PORT: 25
      MAIL_SUBMISSION_PORT: 587
      MAIL_SMTPS_PORT: 465
      MAIL_IMAP_PORT: 143
      MAIL_IMAPS_PORT: 993
      MAIL_POP3_PORT: 110
      MAIL_POP3S_PORT: 995
    expose:
      - "3131"
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3131/api/auth/setup').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - frontends:/app/public/frontends
      - uploads:/app/public/uploads
      - downloads:/app/public/downloads
      - appdata:/app/data

volumes:
  postgres-init:
  pgdata:
  frontends:
  uploads:
  downloads:
  appdata:
