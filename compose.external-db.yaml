# App-only Docker Compose for an existing PostgreSQL server.
# Use with: docker compose -f compose.external-db.yaml up -d --build
# The app only reads DATABASE_URL; do not add split POSTGRES_* credentials.
# Host mail ports are published only when they are free. Omit this file's mail
# mappings if another mail server on the same host already owns them.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3131
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN in .env}
      MAIL_SESSION_SECRET: ${MAIL_SESSION_SECRET:?set MAIL_SESSION_SECRET in .env}
      MAIL_DATA_DIR: /app/data/mail
      MAIL_SMTP_PORT: 25
      MAIL_SUBMISSION_PORT: 587
      MAIL_SMTPS_PORT: 465
      MAIL_IMAP_PORT: 143
      MAIL_IMAPS_PORT: 993
      MAIL_POP3_PORT: 110
      MAIL_POP3S_PORT: 995
    ports:
      - "${WEB_PORT:-3131}:3131"
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3131/api/auth/setup').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - frontends:/app/public/frontends
      - uploads:/app/public/uploads
      - downloads:/app/public/downloads
      - appdata:/app/data

volumes:
  frontends:
  uploads:
  downloads:
  appdata:
