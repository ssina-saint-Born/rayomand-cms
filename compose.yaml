# Rayomand CMS with its own PostgreSQL. Two containers, no external relay.
#
#   cp .env.example .env   # set POSTGRES_PASSWORD and SETUP_TOKEN
#   docker compose up -d --build
#
# Then open http://localhost:3131 and paste SETUP_TOKEN to create the owner.
#
# Port 25 must be reachable from the host for inbound mail; if a host MTA
# already owns it, disable that, or change MAIL_SMTP_PORT and forward.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noma}
      POSTGRES_USER: ${POSTGRES_USER:-noma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noma} -d ${POSTGRES_DB:-noma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3131
      DATABASE_URL: postgresql://${POSTGRES_USER:-noma}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noma}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      MAIL_SESSION_SECRET: ${MAIL_SESSION_SECRET:-}
      MAIL_SMTP_PORT: 25
      MAIL_SUBMISSION_PORT: 587
      MAIL_SMTPS_PORT: 465
      MAIL_IMAP_PORT: 143
      MAIL_IMAPS_PORT: 993
      MAIL_POP3_PORT: 110
      MAIL_POP3S_PORT: 995
    ports:
      - "3131:3131"   # web
      - "25:25"       # SMTP inbound
      - "587:587"     # submission
      - "465:465"     # SMTPS
      - "143:143"     # IMAP
      - "993:993"     # IMAPS
      - "110:110"     # POP3
      - "995:995"     # POP3S
    # Only the capability to bind privileged ports is added; nothing else.
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - frontends:/app/public/frontends

volumes:
  pgdata:
  frontends:
