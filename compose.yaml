# Rayomand CMS with bundled PostgreSQL. The only database setting is DATABASE_URL.
#
#   cp .env.example .env
#   ./scripts/configure-docker.sh
#   docker compose up -d --build
#
# For an existing database, use compose.external-db.yaml instead. In Coolify,
# use compose.coolify.yaml so Traefik routes HTTPS without publishing a second
# web port or colliding with mail ports owned by another service.
#
# `app` is listed first so tools that attach a domain to the first service pick
# the long-running web container rather than the one-shot postgres-init.

services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3131
      # Also accept traffic on 80 for proxies that assume the container port is
      # 80 when a domain does not name one.
      WEB_ALIAS_PORT: 80
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # Written by postgres-init with the host rewritten to the internal
      # `postgres` service; takes precedence over DATABASE_URL at runtime.
      DATABASE_URL_FILE: /db-init/url
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN in .env}
      # Optional: the site's public address for the setup endpoint's
      # same-origin check when a reverse proxy rewrites Host.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      MAIL_SESSION_SECRET: ${MAIL_SESSION_SECRET:?set MAIL_SESSION_SECRET in .env}
      MAIL_DATA_DIR: /app/data/mail
      MAIL_SMTP_PORT: 25
      MAIL_SUBMISSION_PORT: 587
      MAIL_SMTPS_PORT: 465
      MAIL_IMAP_PORT: 143
      MAIL_IMAPS_PORT: 993
      MAIL_POP3_PORT: 110
      MAIL_POP3S_PORT: 995
    ports:
      - "${WEB_PORT:-3131}:3131"
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3131/api/auth/setup').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - postgres-init:/db-init:ro
      - frontends:/app/public/frontends
      - uploads:/app/public/uploads
      - downloads:/app/public/downloads
      - appdata:/app/data

  postgres-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DB_INIT_DIR: /db-init
    volumes:
      - postgres-init:/db-init

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER_FILE: /db-init/user
      POSTGRES_PASSWORD_FILE: /db-init/password
      POSTGRES_DB_FILE: /db-init/database
    volumes:
      - postgres-init:/db-init:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /db-init/user)\" -d \"$$(cat /db-init/database)\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-init:
  pgdata:
  frontends:
  uploads:
  downloads:
  appdata:
